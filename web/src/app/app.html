<router-outlet></router-outlet>

<!-- ข้อความแจ้งเตือนมุมจอ (daisyUI toast) -->
@if (notify.text()) {
  <div class="toast toast-end">
    <div class="alert" [class.alert-success]="notify.type() === 'success'" [class.alert-error]="notify.type() === 'error'">
      <span>{{ notify.text() }}</span>
    </div>
  </div>
}
