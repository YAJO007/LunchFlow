<svg [attr.viewBox]="'0 0 ' + size + ' ' + size" class="h-full w-full">
  
  @for (t of tiles(); track t.url) {
    <image [attr.href]="t.url" [attr.x]="t.x" [attr.y]="t.y" width="256" height="256" />
  }

  
  @for (job of jobs; track job.rider_no) {
    <polyline [attr.points]="linePoints(job)" [attr.stroke]="job.color" fill="none" stroke-width="4" />
  }

  
  @for (p of points; track $index) {
    <circle [attr.cx]="x(p.lng)" [attr.cy]="y(p.lat)" r="5" [attr.fill]="p.color" stroke="white" stroke-width="1.5" />
  }

  
  @for (job of jobs; track job.rider_no) {
    @for (stop of job.stops; track stop.stop_no) {
      <circle [attr.cx]="x(stop.longitude)" [attr.cy]="y(stop.latitude)" r="6" [attr.fill]="job.color" stroke="white" stroke-width="2" />
    }
  }

  
  <circle [attr.cx]="x(shop.longitude)" [attr.cy]="y(shop.latitude)" r="10" fill="black" stroke="white" stroke-width="2" />

  
  <text [attr.x]="size - 4" [attr.y]="size - 4" text-anchor="end" font-size="9" fill="black">© OpenStreetMap</text>
</svg>
