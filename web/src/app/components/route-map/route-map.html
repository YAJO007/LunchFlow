<svg [attr.viewBox]="'0 0 ' + size + ' ' + size" class="h-full w-full">
  
  @for (r of rings; track r) {
    <circle [attr.cx]="size / 2" [attr.cy]="size / 2" [attr.r]="r * scale()" fill="none" stroke="#cccccc" stroke-dasharray="4 4" />
  }

  
  @for (job of jobs; track job.rider_no) {
    <polyline [attr.points]="linePoints(job)" [attr.stroke]="job.color" fill="none" stroke-width="3" />
  }

  
  @for (p of points; track $index) {
    <circle [attr.cx]="x(p.lng)" [attr.cy]="y(p.lat)" r="5" [attr.fill]="p.color" />
  }

  
  @for (job of jobs; track job.rider_no) {
    @for (stop of job.stops; track stop.stop_no) {
      <circle [attr.cx]="x(stop.longitude)" [attr.cy]="y(stop.latitude)" r="6" [attr.fill]="job.color" />
    }
  }

  
  <circle [attr.cx]="x(shop.longitude)" [attr.cy]="y(shop.latitude)" r="10" fill="black" />
</svg>
