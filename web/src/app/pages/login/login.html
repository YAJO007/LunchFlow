<div class="flex min-h-screen items-center justify-center bg-base-200 px-4">
  <form class="card w-full max-w-md bg-base-100" (ngSubmit)="login()">
    <div class="card-body">
      <div class="flex items-center gap-2 text-lg font-semibold text-primary">
        <i class="fa-solid fa-bowl-rice"></i>
        LunchFlow
      </div>
      <h1 class="mt-4 text-3xl">เข้าสู่ระบบ</h1>
      <p class="text-base-content/70">ใช้บัญชีเจ้าของร้านเพื่อจัดการออเดอร์และเส้นทาง</p>

      <fieldset class="fieldset mt-2">
        <legend class="fieldset-legend">ชื่อผู้ใช้</legend>
        <input name="username" type="text" autocomplete="username" class="input w-full"
          [class.input-error]="error()" [(ngModel)]="username" />

        <legend class="fieldset-legend">รหัสผ่าน</legend>
        <input name="password" [type]="showPassword() ? 'text' : 'password'" autocomplete="current-password"
          class="input w-full" [class.input-error]="error()" [(ngModel)]="password" />

        <label class="label mt-2">
          <input type="checkbox" class="checkbox checkbox-sm" [checked]="showPassword()"
            (change)="showPassword.set(!showPassword())" />
          แสดงรหัสผ่าน
        </label>
      </fieldset>

      @if (error()) {
        <p class="text-error">
          <i class="fa-solid fa-circle-exclamation"></i>
          {{ error() }}
        </p>
      }

      <p class="text-sm text-base-content/70">บัญชีทดลอง: <b>owner</b> / <b>1234</b></p>

      <div class="card-actions mt-4 justify-between">
        <a routerLink="/" class="btn btn-ghost">กลับหน้าแรก</a>
        <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
      </div>
    </div>
  </form>
</div>
