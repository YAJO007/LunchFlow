<div class="mx-auto max-w-sm p-6">
  <h1 class="text-2xl font-bold">เข้าสู่ระบบเจ้าของร้าน</h1>

  <div class="mt-4 flex flex-col gap-3">
    <input type="text" placeholder="ชื่อผู้ใช้" class="input w-full" [(ngModel)]="username" />
    <input type="password" placeholder="รหัสผ่าน" class="input w-full" [(ngModel)]="password" />
    @if (error()) {
      <p class="text-error">{{ error() }}</p>
    }
    <button class="btn btn-primary" (click)="login()">เข้าสู่ระบบ</button>
  </div>

  <p class="mt-4 text-sm">ทดลอง: owner / 1234</p>
  <a routerLink="/" class="link mt-2 block text-sm">กลับหน้าแรก</a>
</div>
