<div class="page">
  <form class="card" (ngSubmit)="login()">
    <div class="logo">
      <svg viewBox="0 -960 960 960" width="28" height="28" aria-hidden="true">
        <path fill="currentColor" d="M610-510v-250h210q24 0 42 18t18 42v190H610ZM140-200q-24 0-42-18t-18-42v-440q0-24 18-42t42-18h410v560H140Zm175-230q21 0 35.5-15t14.5-35q0-21-14.5-35.5T315-530q-20 0-35 14.5T265-480q0 20 15 35t35 15Zm295 230v-250h270v190q0 24-18 42t-42 18H610Z" />
      </svg>
      <span>LunchFlow</span>
    </div>

    <h1>เข้าสู่ระบบ</h1>
    <p class="subtitle">ใช้บัญชีเจ้าของร้านเพื่อจัดการออเดอร์และเส้นทาง</p>

    <div class="field" [class.invalid]="error()">
      <input id="username" name="username" type="text" placeholder=" " autocomplete="username"
        [(ngModel)]="username" />
      <label for="username">ชื่อผู้ใช้</label>
    </div>

    <div class="field" [class.invalid]="error()">
      <input id="password" name="password" [type]="showPassword() ? 'text' : 'password'" placeholder=" "
        autocomplete="current-password" [(ngModel)]="password" />
      <label for="password">รหัสผ่าน</label>
    </div>

    @if (error()) {
      <p class="error">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2zm0-4h-2V7h2z" />
        </svg>
        {{ error() }}
      </p>
    }

    <label class="show-password">
      <input type="checkbox" [checked]="showPassword()" (change)="showPassword.set(!showPassword())" />
      แสดงรหัสผ่าน
    </label>

    <p class="hint">บัญชีทดลอง: <b>owner</b> / <b>1234</b></p>

    <div class="actions">
      <a routerLink="/" class="text-btn">กลับหน้าแรก</a>
      <button type="submit" class="primary-btn">ถัดไป</button>
    </div>
  </form>
</div>
