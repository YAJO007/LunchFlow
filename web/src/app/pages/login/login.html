<div class="page">
  <form class="card" (ngSubmit)="login()">
    <div class="logo">
      <i class="fa-solid fa-bowl-rice" aria-hidden="true"></i>
      <span>LunchFlow</span>
    </div>

    <h1>เข้าสู่ระบบ</h1>
    <p class="subtitle">ใช้บัญชีเจ้าของร้านเพื่อจัดการออเดอร์และเส้นทาง</p>

    <div class="field" [class.invalid]="error()">
      <input id="username" name="username" type="text" placeholder=" " autocomplete="username"
        [(ngModel)]="username" />
      <label for="username">ชื่อผู้ใช้</label>
    </div>

    <div class="field" [class.invalid]="error()">
      <input id="password" name="password" [type]="showPassword() ? 'text' : 'password'" placeholder=" "
        autocomplete="current-password" [(ngModel)]="password" />
      <label for="password">รหัสผ่าน</label>
    </div>

    @if (error()) {
      <p class="error">
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
        {{ error() }}
      </p>
    }

    <label class="show-password">
      <input type="checkbox" [checked]="showPassword()" (change)="showPassword.set(!showPassword())" />
      แสดงรหัสผ่าน
    </label>

    <p class="hint">บัญชีทดลอง: <b>owner</b> / <b>1234</b></p>

    <div class="actions">
      <a routerLink="/" class="text-btn">กลับหน้าแรก</a>
      <button type="submit" class="primary-btn">ถัดไป</button>
    </div>
  </form>
</div>
