<h1 class="text-2xl font-bold">ไรเดอร์</h1>

<p class="mt-2">
  พร้อมรับงาน {{ appData.availableRiders().length }} คน ·
  รับได้สูงสุด {{ appData.availableRiders().length * appData.shop().maxOrdersPerRider }} ออเดอร์
</p>

<div class="mt-4 flex flex-wrap gap-2">
  <input type="text" class="input" placeholder="ชื่อไรเดอร์" [(ngModel)]="newName" />
  <input type="text" class="input" placeholder="เบอร์โทร" [(ngModel)]="newPhone" />
  <button class="btn btn-primary" (click)="add()">เพิ่ม</button>
  <button class="btn" (click)="appData.resetRiders()">ค่าเริ่มต้น</button>
</div>

<div class="mt-4 overflow-x-auto">
  <table class="table">
    <thead>
      <tr>
        <th>#</th>
        <th>ชื่อ</th>
        <th>เบอร์โทร</th>
        <th>พร้อมรับงาน</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (r of appData.riders(); track r.no) {
        <tr>
          <td>{{ r.no }}</td>
          <td>{{ r.name }}</td>
          <td>{{ r.phone }}</td>
          <td><input type="checkbox" class="toggle" [checked]="r.available" (change)="toggle(r)" /></td>
          <td><button class="btn btn-sm btn-error" (click)="remove(r)">ลบ</button></td>
        </tr>
      } @empty {
        <tr><td colspan="5">ยังไม่มีไรเดอร์</td></tr>
      }
    </tbody>
  </table>
</div>
