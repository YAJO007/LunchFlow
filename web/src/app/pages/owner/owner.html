
<div class="min-h-screen bg-white text-[#202124] [--color-primary-content:#ffffff] [--color-primary:#1e8e3e]">
  
  <header class="sticky top-0 z-[1100] border-b border-[#dadce0] bg-white">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-4 px-4 pt-2 md:h-16 md:flex-nowrap md:pt-0">
      <a routerLink="/owner"
        class="flex h-12 flex-1 shrink-0 items-center gap-2 text-xl font-semibold text-[#1e8e3e] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1e8e3e] md:h-auto md:flex-none">
        <i class="fa-solid fa-bowl-rice text-[22px]" aria-hidden="true"></i>
        <span>LunchFlow</span>
      </a>

   
      <nav
        class="order-3 -mx-4 flex basis-[calc(100%+2rem)] gap-1 overflow-x-auto px-3 pb-2 [scrollbar-width:none] md:order-none md:mx-0 md:ml-4 md:flex-1 md:basis-auto md:px-0 md:pb-0 [&::-webkit-scrollbar]:hidden">
        @for (item of menu; track item.link) {
          <a [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
            class="inline-flex h-9 items-center rounded-full px-4 text-sm font-medium whitespace-nowrap text-[#5f6368] transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1e8e3e] [&.active]:bg-[#e6f4ea] [&.active]:text-[#137333] [&:not(.active)]:hover:bg-[#f1f3f4] [&:not(.active)]:hover:text-[#202124]">
            {{ item.label }}
          </a>
        }
      </nav>

      <button (click)="logout()"
        class="inline-flex h-9 shrink-0 cursor-pointer items-center gap-2 rounded-full border border-[#dadce0] px-3 text-sm font-medium text-[#1e8e3e] transition-colors hover:bg-[#e6f4ea] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1e8e3e] md:px-4">
        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
        <span class="hidden md:inline">ออกจากระบบ</span>
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6">
    <router-outlet></router-outlet>
  </main>
</div>
