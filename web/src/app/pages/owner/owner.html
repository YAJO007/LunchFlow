<header class="topbar">
  <div class="topbar-inner">
    <a routerLink="/owner" class="logo">
      <svg viewBox="0 -960 960 960" width="26" height="26" aria-hidden="true">
        <path fill="currentColor" d="M610-510v-250h210q24 0 42 18t18 42v190H610ZM140-200q-24 0-42-18t-18-42v-440q0-24 18-42t42-18h410v560H140Zm175-230q21 0 35.5-15t14.5-35q0-21-14.5-35.5T315-530q-20 0-35 14.5T265-480q0 20 15 35t35 15Zm295 230v-250h270v190q0 24-18 42t-42 18H610Z" />
      </svg>
      <span>LunchFlow</span>
    </a>

    <nav class="nav">
      @for (item of menu; track item.link) {
        <a [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link">{{ item.label }}</a>
      }
    </nav>

    <button class="logout-btn" (click)="logout()">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor"
          d="M10 17v-3H3v-4h7V7l5 5zm2-15h7a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2h-7v-2h7V4h-7z" />
      </svg>
      <span>ออกจากระบบ</span>
    </button>
  </div>
</header>

<main class="content">
  <router-outlet></router-outlet>
</main>
