<header class="topbar">
  <div class="topbar-inner">
    <a routerLink="/owner" class="logo">
      <i class="fa-solid fa-bowl-rice" aria-hidden="true"></i>
      <span>LunchFlow</span>
    </a>

    <nav class="nav">
      @for (item of menu; track item.link) {
        <a [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link">{{ item.label }}</a>
      }
    </nav>

    <button class="logout-btn" (click)="logout()">
      <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
      <span>ออกจากระบบ</span>
    </button>
  </div>
</header>

<main class="content">
  <router-outlet></router-outlet>
</main>
