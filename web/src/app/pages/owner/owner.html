<div class="min-h-screen bg-base-100">
  <!-- แถบด้านบน: โลโก้ + เมนู + ออกจากระบบ -->
  <header class="sticky top-0 z-50 border-b border-base-300 bg-base-100">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-2 px-4 py-2">
      <a routerLink="/owner" class="flex items-center gap-2 text-xl font-semibold text-primary">
        <i class="fa-solid fa-bowl-rice"></i>
        LunchFlow
      </a>

      <nav class="order-last flex w-full gap-1 overflow-x-auto md:order-none md:ml-6 md:w-auto md:flex-1">
        @for (item of menu; track item.link) {
          <a [routerLink]="item.link" routerLinkActive="btn-secondary" [routerLinkActiveOptions]="{ exact: true }"
            class="btn btn-ghost btn-sm">
            <i [class]="item.icon"></i>
            {{ item.label }}
          </a>
        }
      </nav>

      <button class="btn btn-outline btn-sm ml-auto md:ml-0" (click)="logout()">
        <i class="fa-solid fa-right-from-bracket"></i>
        ออกจากระบบ
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6">
    <router-outlet></router-outlet>
  </main>
</div>
